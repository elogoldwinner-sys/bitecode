<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Redirecting…</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="config.js"></script></head>
<body style="font-family:system-ui;text-align:center;padding:3rem;color:#0d1b2a">Redirecting…
<script>
(async()=>{
 const id=new URLSearchParams(location.search).get('c');
 try{
  if(!/^[a-z0-9]{4,16}$/.test(id||''))throw 0;
  const sb=supabase.createClient(BC.url,BC.key);
  const {data,error}=await sb.rpc('resolve_code',{p_id:id,p_ua:navigator.userAgent});
  if(error||!data||!/^https?:\/\//i.test(data))throw 0;
  location.replace(data);
 }catch(e){document.body.textContent='This code is inactive or does not exist.'}
})();
</script></body></html>
